<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Should I Recycle This?</title>
<style>
  /* Design tokens — a refined dark palette (deep slate surfaces, emerald +
     sky-blue accents) so colors, radii, and shadows stay consistent and easy
     to retune from one place. */
  :root {
    color-scheme: dark;
    --bg: #0a0e16;
    --surface: #131a24;
    --surface-2: #1a2330;
    --border: #253044;
    --border-strong: #34415a;
    --text: #eef2f6;
    --text-muted: #96a3b8;
    --text-faint: #616f82;
    --accent: #34d399;      /* emerald */
    --accent-2: #38bdf8;    /* sky blue */
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.45);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    position: relative;
    padding: 3rem 1.5rem;
  }

  /* Soft, purely decorative ambient glow behind the content */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 18% 15%, rgba(56, 189, 248, 0.16), transparent 45%),
      radial-gradient(circle at 82% 85%, rgba(52, 211, 153, 0.14), transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  h1 {
    position: relative;
    z-index: 1;
    font-size: clamp(2.25rem, 5.5vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0 0 2.5rem;
    text-align: center;
  }

  /* Card that groups the input, button, and result together */
  .form-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 1.75rem;
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2.25rem 2rem;
    box-shadow: var(--shadow-lg);
  }

  #itemInput {
    padding: 1.15rem 1.3rem;
    font-size: 1.2rem;
    width: 100%;
    font-family: inherit;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-md);
    background-color: var(--surface-2);
    color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #itemInput::placeholder {
    color: var(--text-faint);
  }

  #itemInput:focus {
    outline: none;
    border-color: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
  }

  #itemInput:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #submitBtn {
    padding: 1.25rem 1.75rem;
    font-size: 1.25rem;
    font-weight: 600;
    width: 100%;
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    color: #06251c;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    transition: filter 0.15s ease, transform 0.15s ease;
  }

  #submitBtn:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  #submitBtn:active {
    transform: translateY(0);
  }

  #submitBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  #resultText {
    margin: 0.25rem 0 0;
    font-size: 1.35rem;
    font-weight: 600;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
  }

  #resultReasoning {
    margin: 0;
    font-size: 1.05rem;
    color: var(--text-muted);
    text-align: center;
  }

  #resultTip {
    margin: 0;
    font-size: 1.05rem;
    color: var(--accent);
    text-align: center;
    line-height: 1.5;
  }

  /* Collapse empty result/status paragraphs so the card doesn't reserve
     blank gap for text that hasn't been filled in yet */
  #resultText:empty,
  #resultReasoning:empty,
  #resultTip:empty {
    display: none;
  }

  /* Full-screen overlay shown when Claude needs a follow-up answer before it
     can give a final verdict. Visibility is toggled with the .open class
     (not the `hidden` attribute) so it can't be silently overridden by the
     display rule below. */
  #followupModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 12, 0.72);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1.5rem;
  }

  #followupModal.open {
    display: flex;
  }

  .followup-box {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    padding: 2.25rem;
    max-width: 480px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1.6rem;
    box-shadow: var(--shadow-lg);
  }

  #followupQuestionText {
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1.4;
    text-align: center;
    margin: 0;
    color: var(--text);
  }

  #followupInput {
    padding: 1.05rem 1.25rem;
    font-size: 1.2rem;
    width: 100%;
    font-family: inherit;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background-color: var(--surface-2);
    color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #followupInput::placeholder {
    color: var(--text-faint);
  }

  #followupInput:focus {
    outline: none;
    border-color: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
  }

  #followupInput:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #followupSubmitBtn {
    padding: 1.15rem 1.5rem;
    font-size: 1.2rem;
    font-weight: 600;
    width: 100%;
    border: none;
    border-radius: var(--radius-sm);
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    color: #06251c;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    transition: filter 0.15s ease, transform 0.15s ease;
  }

  #followupSubmitBtn:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  #followupSubmitBtn:active {
    transform: translateY(0);
  }

  #followupSubmitBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Spinning wheel shown while "thinking" */
  .spinner {
    width: 1.2rem;
    height: 1.2rem;
    border: 3px solid rgba(255, 255, 255, 0.2);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Button at the top that opens the history sidebar */
  #historyBtn {
    position: fixed;
    top: 1.5rem;
    left: 1.5rem;
    z-index: 2;
    padding: 0.75rem 1.4rem;
    font-size: 1rem;
    font-weight: 600;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background-color: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  #historyBtn:hover {
    border-color: var(--accent);
    background-color: var(--surface-2);
  }

  /* Sidebar that slides in from the left */
  #historySidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: 300px;
    max-width: 85vw;
    background-color: var(--surface);
    border-right: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    padding: 2rem 1.5rem;
    /* Hidden off-screen until the "open" class is added */
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: 200;
    overflow-y: auto;
  }

  #historySidebar.open {
    transform: translateX(0);
  }

  #historySidebar h2 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
    margin: 0 0 1.25rem;
  }

  /* Arrow button inside the sidebar that closes it */
  #closeSidebarBtn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    margin-bottom: 1rem;
    padding: 0.25rem;
    border-radius: 6px;
    transition: color 0.15s ease, background-color 0.15s ease;
  }

  #closeSidebarBtn:hover {
    color: var(--text);
    background-color: var(--surface-2);
  }

  #historyList {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  #historyList li {
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  #historyList li:last-child {
    border-bottom: none;
  }
</style>
</head>
<body>
  <!-- Button at the top that opens the past-recycles sidebar -->
  <button id="historyBtn">History</button>

  <h1>Should I Recycle This?</h1>

  <div class="form-container">
    <!-- Text input where the user types an item name -->
    <input type="text" id="itemInput" placeholder="Enter an item">

    <!-- Submit button -->
    <button id="submitBtn">Check</button>

    <!-- Placeholder text shown after clicking submit; empty until then -->
    <p id="resultText"></p>
    <!-- Claude's reasoning behind the verdict -->
    <p id="resultReasoning"></p>
    <!-- A practical how-to tip for handling the item -->
    <p id="resultTip"></p>
  </div>

  <!-- Modal shown when Claude needs a follow-up answer before it can give a final
       verdict. Has its own input + submit button, separate from the item input,
       so an answer here is never mistaken for a new item to check. -->
  <div id="followupModal">
    <div class="followup-box">
      <p id="followupQuestionText"></p>
      <input type="text" id="followupInput" placeholder="Your answer">
      <button id="followupSubmitBtn">Submit answer</button>
    </div>
  </div>

  <!-- Sidebar showing past recycled items; hidden until the History button is clicked -->
  <div id="historySidebar">
    <!-- Arrow to close the sidebar -->
    <button id="closeSidebarBtn">&larr;</button>
    <h2>Past Recycles</h2>
    <ul id="historyList">
      <li>You have none yet</li>
    </ul>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // Fetched from the server's /api/config route, which reads them from .env —
    // keeps these values out of the source instead of hardcoding them here.
    const { supabaseUrl, supabaseKey } = await fetch('/api/config').then((res) => res.json());
    const supabase = createClient(supabaseUrl, supabaseKey);

    const itemInput = document.getElementById('itemInput');
    const submitBtn = document.getElementById('submitBtn');
    const resultText = document.getElementById('resultText');
    const resultReasoning = document.getElementById('resultReasoning');
    const resultTip = document.getElementById('resultTip');
    const followupModal = document.getElementById('followupModal');
    const followupQuestionText = document.getElementById('followupQuestionText');
    const followupInput = document.getElementById('followupInput');
    const followupSubmitBtn = document.getElementById('followupSubmitBtn');
    const historyBtn = document.getElementById('historyBtn');
    const historySidebar = document.getElementById('historySidebar');
    const closeSidebarBtn = document.getElementById('closeSidebarBtn');
    const historyList = document.getElementById('historyList');

    const verdictLabels = { yes: 'Yes', no: 'No', ambiguous: 'Ambiguous' };

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function renderHistory() {
      const { data, error } = await supabase
        .from('recycle_log')
        .select('item_name, is_recyclable, checked_at')
        .order('checked_at', { ascending: false })
        .limit(50);

      if (error) {
        console.error('Failed to load recycle_log history:', error);
        return;
      }

      if (!data || data.length === 0) {
        historyList.innerHTML = '<li>You have none yet</li>';
        return;
      }

      historyList.innerHTML = data
        .map((row) => {
          const label = verdictLabels[row.is_recyclable] ?? row.is_recyclable;
          return `<li>${escapeHtml(row.item_name)} — ${label}</li>`;
        })
        .join('');
    }

    // Open the sidebar when the History button is clicked, refreshing the list first
    historyBtn.addEventListener('click', () => {
      renderHistory();
      historySidebar.classList.add('open');
    });

    // Close the sidebar when the arrow inside it is clicked
    closeSidebarBtn.addEventListener('click', () => {
      historySidebar.classList.remove('open');
    });

    const verdictMessages = {
      yes: 'Yes, that can be recycled!',
      no: "No, that can't be recycled.",
      ambiguous: "It's ambiguous — check your local recycling guidelines.",
    };

    // Tracks the item + question we're waiting on an answer for. While this is
    // set, the app is not expecting a new item — the original input is
    // disabled and checkItem() bails out, so an answer can't be misread as a
    // fresh item to check.
    let pendingFollowup = null; // { itemName, question } | null

    function openFollowupModal(itemName, question) {
      pendingFollowup = { itemName, question };
      followupQuestionText.textContent = question;
      followupInput.value = '';
      followupModal.classList.add('open');
      itemInput.disabled = true;
      submitBtn.disabled = true;
      followupInput.focus();
    }

    function closeFollowupModal() {
      pendingFollowup = null;
      followupModal.classList.remove('open');
      itemInput.disabled = false;
      submitBtn.disabled = false;
    }

    async function logResult(itemName, verdict) {
      const { error } = await supabase
        .from('recycle_log')
        .insert({ item_name: itemName, is_recyclable: verdict });

      if (error) {
        console.error('Failed to save recycle_log row:', error);
      } else {
        renderHistory();
      }
    }

    // Puts a button into/out of a disabled, spinner-showing "thinking" state.
    // The spinner lives on whichever button was actually pressed, so it's
    // always visible to the user — unlike a spinner placed in the results
    // area, which the follow-up modal's backdrop would otherwise cover.
    function setButtonLoading(button, isLoading, idleLabel) {
      button.disabled = isLoading;
      button.innerHTML = isLoading ? '<span class="spinner"></span> Thinking...' : idleLabel;
    }

    async function checkItem() {
      if (pendingFollowup) return;

      const itemName = itemInput.value.trim();
      if (!itemName) return;

      itemInput.disabled = true;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Thinking...';
      resultText.textContent = '';
      resultReasoning.textContent = '';
      resultTip.textContent = '';

      try {
        // Ask Claude (via our server, which holds the API key) for a verdict
        const checkResponse = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemName }),
        });
        const { verdict, followup, tip } = await checkResponse.json(); // verdict: 'yes' | 'no' | 'ambiguous'
        resultText.textContent = verdictMessages[verdict] ?? verdictMessages.ambiguous;
        resultTip.textContent = tip ? `💡 Tip: ${tip}` : '';

        if (followup && followup !== 'none') {
          openFollowupModal(itemName, followup);
        }

        await logResult(itemName, verdict);
      } catch (error) {
        console.error('Failed to check item:', error);
        resultText.textContent = 'Something went wrong — please try again.';
      } finally {
        submitBtn.innerHTML = 'Check';
        // Leave itemInput/submitBtn disabled if a follow-up modal just opened
        if (!pendingFollowup) {
          itemInput.disabled = false;
          submitBtn.disabled = false;
        }
      }
    }

    async function submitFollowupAnswer() {
      const answer = followupInput.value.trim();
      if (!answer || !pendingFollowup) return;

      const { itemName, question } = pendingFollowup;

      followupInput.disabled = true;
      setButtonLoading(followupSubmitBtn, true, 'Submit answer');
      resultText.textContent = '';
      resultTip.textContent = '';

      try {
        // Second AI call: original item + the question Claude asked + the
        // user's answer, for one decisive final verdict
        const checkResponse = await fetch('/api/check-followup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemName, question, answer }),
        });
        const { verdict, tip } = await checkResponse.json(); // verdict: 'yes' | 'no' | 'ambiguous'

        resultText.textContent = verdictMessages[verdict] ?? verdictMessages.ambiguous;
        resultTip.textContent = tip ? `💡 Tip: ${tip}` : '';

        closeFollowupModal();
        await logResult(itemName, verdict);
      } catch (error) {
        console.error('Failed to check follow-up answer:', error);
        resultText.textContent = 'Something went wrong — please try again.';
      } finally {
        followupInput.disabled = false;
        setButtonLoading(followupSubmitBtn, false, 'Submit answer');
      }
    }

    submitBtn.addEventListener('click', checkItem);
    followupSubmitBtn.addEventListener('click', submitFollowupAnswer);

    // Let the user press Enter in the input box to submit too
    itemInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        checkItem();
      }
    });

    followupInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        submitFollowupAnswer();
      }
    });
  </script>
</body>
</html>
