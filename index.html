<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Should I Recycle This?</title>
<style>
  /* Dark theme colors, defined once so they're easy to change later */
  :root {
    --bg-color: #0b0f14;       /* near-black background */
    --blue-accent: #4da6ff;    /* used for title + input border */
    --green-accent: #4caf50;   /* used for button */
    --text-color: #e6e6e6;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    /* A more colorful dark gradient: blue -> teal -> green -> purple */
    background: linear-gradient(135deg, #0d1b3d 0%, #0a2b3d 30%, #0b3d2b 60%, #1e0b3d 100%);
    color: var(--text-color);
  }

  h1 {
    font-size: 3rem;
    /* Title text itself fades from blue to green */
    background: linear-gradient(90deg, var(--blue-accent), var(--green-accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 3rem;
    text-align: center;
  }

  /* Groups the input and button together, sized to fill most of the page */
  .form-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    width: 80%;
    max-width: 700px;
  }

  #itemInput {
    padding: 1.25rem 1.5rem;
    font-size: 1.5rem;
    width: 100%;
    box-sizing: border-box;
    border: 2px solid var(--blue-accent);
    border-radius: 12px;
    background-color: #1a1f26;
    color: var(--text-color);
  }

  #itemInput:focus {
    outline: none;
    border-color: var(--green-accent);
  }

  #submitBtn {
    padding: 1.5rem 2rem;
    font-size: 1.75rem;
    width: 100%;
    border: none;
    border-radius: 12px;
    /* Blue-to-green fade on the button */
    background: linear-gradient(90deg, var(--blue-accent), var(--green-accent));
    color: #fff;
    cursor: pointer;
    transition: filter 0.2s ease;
  }

  #submitBtn:hover {
    filter: brightness(1.15);
  }

  #resultText {
    margin-top: 2rem;
    font-size: 1.25rem;
    text-align: center;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  /* Spinning wheel shown while "thinking" */
  .spinner {
    width: 1.25rem;
    height: 1.25rem;
    border: 3px solid rgba(255, 255, 255, 0.2);
    border-top-color: var(--green-accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Button at the top that opens the history sidebar */
  #historyBtn {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    padding: 0.6rem 1.1rem;
    font-size: 1rem;
    border: 2px solid var(--green-accent);
    border-radius: 8px;
    background-color: transparent;
    color: var(--text-color);
    cursor: pointer;
  }

  #historyBtn:hover {
    background-color: rgba(76, 175, 80, 0.15);
  }

  /* Sidebar that slides in from the right */
  #historySidebar {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 280px;
    background-color: #10151c;
    border-left: 2px solid var(--blue-accent);
    box-shadow: -4px 0 12px rgba(0, 0, 0, 0.4);
    padding: 2rem 1.5rem;
    box-sizing: border-box;
    /* Hidden off-screen until the "open" class is added */
    transform: translateX(100%);
    transition: transform 0.3s ease;
  }

  #historySidebar.open {
    transform: translateX(0);
  }

  #historySidebar h2 {
    font-size: 1.25rem;
    color: var(--green-accent);
    margin-top: 0;
    margin-bottom: 1rem;
  }

  /* Arrow button inside the sidebar that closes it */
  #closeSidebarBtn {
    background: none;
    border: none;
    color: var(--blue-accent);
    font-size: 1.5rem;
    cursor: pointer;
    margin-bottom: 1rem;
  }

  #historyList {
    list-style: none;
    padding: 0;
    margin: 0;
    color: #aaa;
  }
</style>
</head>
<body>
  <!-- Button at the top that opens the past-recycles sidebar -->
  <button id="historyBtn">History</button>

  <h1>Should I Recycle This?</h1>

  <div class="form-container">
    <!-- Text input where the user types an item name -->
    <input type="text" id="itemInput" placeholder="Enter an item">

    <!-- Submit button -->
    <button id="submitBtn">Check</button>

    <!-- Placeholder text shown after clicking submit; empty until then -->
    <p id="resultText"></p>
  </div>

  <!-- Sidebar showing past recycled items; hidden until the History button is clicked -->
  <div id="historySidebar">
    <!-- Arrow to close the sidebar -->
    <button id="closeSidebarBtn">&rarr;</button>
    <h2>Past Recycles</h2>
    <ul id="historyList">
      <li>You have none yet</li>
    </ul>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://ujlmdyzprrgmpqdmoxoe.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_N_NI3Id_FU5snZguJuGu9w_AqTu7T30';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const itemInput = document.getElementById('itemInput');
    const submitBtn = document.getElementById('submitBtn');
    const resultText = document.getElementById('resultText');
    const historyBtn = document.getElementById('historyBtn');
    const historySidebar = document.getElementById('historySidebar');
    const closeSidebarBtn = document.getElementById('closeSidebarBtn');
    const historyList = document.getElementById('historyList');

    const verdictLabels = { yes: 'Yes', no: 'No', depends: 'Depends' };

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function renderHistory() {
      const { data, error } = await supabase
        .from('recycle_log')
        .select('item_name, is_recyclable, checked_at')
        .order('checked_at', { ascending: false })
        .limit(50);

      if (error) {
        console.error('Failed to load recycle_log history:', error);
        return;
      }

      if (!data || data.length === 0) {
        historyList.innerHTML = '<li>You have none yet</li>';
        return;
      }

      historyList.innerHTML = data
        .map((row) => {
          const label = verdictLabels[row.is_recyclable] ?? row.is_recyclable;
          return `<li>${escapeHtml(row.item_name)} — ${label}</li>`;
        })
        .join('');
    }

    // Open the sidebar when the History button is clicked, refreshing the list first
    historyBtn.addEventListener('click', () => {
      renderHistory();
      historySidebar.classList.add('open');
    });

    // Close the sidebar when the arrow inside it is clicked
    closeSidebarBtn.addEventListener('click', () => {
      historySidebar.classList.remove('open');
    });

    async function checkItem() {
      const itemName = itemInput.value.trim();
      if (!itemName) return;

      // Show a spinning wheel plus a loading message first
      resultText.innerHTML = '<span class="spinner"></span> Thinking...';

      // Simulate a delay while it "thinks", then show the answer
      // TODO: replace with real recycling logic later
      setTimeout(async () => {
        const verdict = 'yes'; // matches is_recyclable's allowed values: 'yes' | 'no' | 'depends'
        resultText.textContent = 'Yes, that can be recycled!';

        const { error } = await supabase
          .from('recycle_log')
          .insert({ item_name: itemName, is_recyclable: verdict });

        if (error) {
          console.error('Failed to save recycle_log row:', error);
        } else {
          renderHistory();
        }
      }, 1000);
    }

    submitBtn.addEventListener('click', checkItem);

    // Let the user press Enter in the input box to submit too
    itemInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        checkItem();
      }
    });
  </script>
</body>
</html>
